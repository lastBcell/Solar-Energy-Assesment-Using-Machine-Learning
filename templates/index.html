<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Energy Forcasting</title>
   <style>@import 'https://fonts.googleapis.com/css?family=Montserrat:300, 400, 700&display=swap';


    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: "{{url_for('static',filename='solar3.jpg')}}"no repeat;
        backdrop-filter: brightness(80%);
    
        background-size: cover;
        background-position: center;
    }
    
    .wrapper{
    
        position: relative;
        width: 400px;
        height: 440px;
    
        border: none;
        border-radius: 20px;
        backdrop-filter: blur(3px);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: height .2s ease;
        overflow: hidden;
        
        
    }
    
    
    .wrapper .form-box{
        width: 100%;
        padding: 40px;
       
       
    }
    
    
    .form-box h2{
        font-size: 2em;
        /* color: rgb(253, 15, 98) ; */
        color: white;
        text-align: center;
    
    
    }
     
    .input-box{
        position: relative;
        width: 100%;
        height: 49px; 
        border-bottom: 1px solid white ;
        margin: 30px 0;
        
    }
    .input-box label{
        position: absolute;
        top: 40px;
        left: 5px;
        transform: translateY(-100%);
        font-size: 1em;
        color: rgb(255, 255, 255);
        font-weight: 700;
        pointer-events: none;
        transition: .5s;
        
       
    
    }
    .input-box input:focus ~ label,
    .input-box input:valid ~ label{
     top: -4px;
    }
    .input-box input:not(:placeholder-shown)~ label{
    top: -4px;
        }
    .input-box input:not(:focus){
      outline:none;
        }
        
    
    .input-box input{
        width: 100%;
        height: 10px;
        background: transparent;
        border:none ;
        font-size: 1em;
        color: rgb(255, 255, 255);
        font-weight: 600;
        padding: 24px  2px;
        outline: 1px solid rgb(255, 255, 255);
        border-radius: 2px;
        padding-left: 6px;
        padding-right: 3px;
       
       
    
    }
    
    
    .btn{
        width: 100%;
        height: 45px;
        background:white;
        border: none;
        outline:none;
        border-radius: 2px;
        cursor: pointer;
        font-size: 1em;
        color: rgb(10, 117, 179);
        font-weight: 600;
        transition: .3s;
        
    
    }
    .btn:hover{
        color: rgb(255, 255, 255);
        background: rgb(12, 141, 216);
    
    }
        
    
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital@1&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body background="../static/solar3.jpg",background=no-repeat>

    </style>
    <!-- <h2 class="section-title">Solar <span>Energy</span>Forcasting</h2> -->
        <div class="form-box login">
           
            <h2>Details</h2>
    
            <form action="" method="post">
                <div class="input-box">
                
                    <input type="" class="email" name="place" required placeholder=" ">
                    <label>Place</label>
                </div>

                <div class="input-box">
                    <input type="" class="months" name="months" required placeholder=" ">
                    <label>Number of Months</label>
                </div>
                <div class="input-box">
                    <input type="" class="panels" name="panels" required placeholder=" " >
                    <label>Number of panels</label>
                </div>
                <button name="submit" type="submit" class="btn" href="/predicted"> Submit </button>
               
            </form>

        </div>


    </div>


    </script>
    <script src=""></script>
</body>

</html>
